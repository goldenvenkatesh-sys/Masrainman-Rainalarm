name: MasRainman Rain Alarm data

on:
  schedule:
    - cron: "4-59/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: rain-alarm-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out the radar engine (read-only)
        uses: actions/checkout@v4
        with:
          repository: goldenvenkatesh-sys/masrainman-nowcast
          ref: main
          path: radar
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: radar/requirements.txt

      # Tesseract .debs are cached between runs so a broken Ubuntu mirror can't
      # stall the cycle. If install still fails, the radar engine carries on
      # without OCR (it falls back to poll-receipt time).
      - name: Work out apt cache key
        id: aptkey
        run: echo "key=apt-tess-v1-${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Restore cached OCR packages
        id: aptcache
        uses: actions/cache/restore@v4
        with:
          path: ~/aptdebs
          key: ${{ steps.aptkey.outputs.key }}

      - name: Install Tesseract OCR
        id: aptinstall
        continue-on-error: true
        timeout-minutes: 3
        run: |
          PKGS="tesseract-ocr"
          APT_OPTS="-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o APT::Keep-Downloaded-Packages=true"
          if ls ~/aptdebs/*.deb >/dev/null 2>&1; then
            echo "Installing $(ls ~/aptdebs/*.deb | wc -l) cached packages"
            if sudo dpkg -i ~/aptdebs/*.deb >/dev/null; then exit 0; fi
            echo "Cached install failed, trying the network"
          fi
          sudo timeout 60 apt-get install -y -qq $APT_OPTS $PKGS \
            || { sudo timeout 40 apt-get update -qq $APT_OPTS || true
                 sudo timeout 60 apt-get install -y -qq $APT_OPTS $PKGS; }
          mkdir -p ~/aptdebs
          if cp /var/cache/apt/archives/*.deb ~/aptdebs/ 2>/dev/null; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save OCR packages to cache
        if: ${{ steps.aptinstall.outcome == 'success' && steps.aptinstall.outputs.fresh == 'true' && steps.aptcache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/aptdebs
          key: ${{ steps.aptkey.outputs.key }}

      - name: Install Python dependencies
        run: pip install -r radar/requirements.txt

      - name: Run radar engine and export app data
        run: python scripts/cycle.py --radar radar

      - name: Commit app data
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "masrainman-rain-alarm-bot"
          git config user.email "masrainman-rain-alarm-bot@users.noreply.github.com"
          git add -A docs/data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "Update rain alarm radar data"
          for i in 1 2 3; do
            # Generated data: if another run pushed first, keep this (newer) cycle's files.
            git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "push failed after 3 tries"
