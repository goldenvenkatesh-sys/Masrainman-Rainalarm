name: MasRainman Rain Alarm data

on:
  schedule:
    - cron: "4-59/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: rain-alarm-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out the radar engine (read-only)
        uses: actions/checkout@v4
        with:
          repository: goldenvenkatesh-sys/masrainman-nowcast
          ref: main
          path: radar
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: radar/requirements.txt

      - name: Install Tesseract OCR
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr

      - name: Install Python dependencies
        run: pip install -r radar/requirements.txt

      - name: Run radar engine and export app data
        run: python scripts/cycle.py --radar radar

      - name: Commit app data
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "masrainman-rain-alarm-bot"
          git config user.email "masrainman-rain-alarm-bot@users.noreply.github.com"
          git add -A docs/data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "Update rain alarm radar data"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          echo "push failed after 3 tries"
